authors        = ["Guy Tsitsiashvili <guygool5@gmail.com>"]
description    = "ESLint LSP for Zed"
id             = "eslint"
name           = "ESLint"
repository     = "https://github.com/GuyGooL5/zed-eslint-extension"
schema_version = 1
version        = "0.0.1"

[language_servers.eslint]
code_action_kinds = ["quickfix"]
language          = "JavaScript"
languages         = ["JavaScript", "JSX", "TypeScript", "TSX", "Vue.js", "Astro", "Svelte", "JSON", "JSONC", "CSS", "GraphQL"]
name              = "Eslint"

[language_servers.eslint.language_ids]
"Astro"      = "astro"
"CSS"        = "css"
"GraphQL"    = "graphql"
"JSON"       = "json"
"JSONC"      = "jsonc"
"JSX"        = "javascriptreact"
"JavaScript" = "javascript"
"Svelte"     = "svelte"
"TSX"        = "typescriptreact"
"TypeScript" = "typescript"
"Vue.js"     = "vuejs"
